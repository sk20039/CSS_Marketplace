<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main pad body -->
  <rect x="50" y="10" width="100" height="178" rx="14" fill="#f1f5f9"/>
  <rect x="50" y="10" width="100" height="178" rx="14" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Stitching lines (horizontal segments) -->
  <line x1="52" y1="48" x2="148" y2="48" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="52" y1="62" x2="148" y2="62" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Knee roll (the protective bulge) -->
  <ellipse cx="100" cy="100" rx="46" ry="24" fill="#e2e8f0"/>
  <ellipse cx="100" cy="100" rx="46" ry="24" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="100" cy="100" rx="35" ry="16" fill="#dde4ed"/>
  <!-- Stitching below knee roll -->
  <line x1="52" y1="138" x2="148" y2="138" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="52" y1="152" x2="148" y2="152" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Straps -->
  <rect x="148" y="40" width="18" height="16" rx="4" fill="#3b82f6"/>
  <rect x="150" y="45" width="14" height="6" rx="2" fill="#2563eb"/>
  <rect x="148" y="130" width="18" height="16" rx="4" fill="#3b82f6"/>
  <rect x="150" y="135" width="14" height="6" rx="2" fill="#2563eb"/>
  <!-- Left edge shading (3D depth) -->
  <rect x="50" y="10" width="14" height="178" rx="8" fill="#dde4ed" opacity="0.6"/>
</svg>
