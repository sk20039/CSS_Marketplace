<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bag end cap left -->
  <ellipse cx="30" cy="118" rx="20" ry="52" fill="#1e3a5f"/>
  <!-- Bag end cap right -->
  <ellipse cx="170" cy="118" rx="20" ry="52" fill="#1e3a5f"/>
  <!-- Main bag body -->
  <rect x="30" y="66" width="140" height="104" rx="0" fill="#1e4976"/>
  <!-- Body top/bottom rounded blend -->
  <rect x="28" y="64" width="144" height="12" rx="4" fill="#1e4976"/>
  <rect x="28" y="156" width="144" height="12" rx="4" fill="#1e4976"/>
  <!-- Main zip line -->
  <line x1="30" y1="70" x2="170" y2="70" stroke="#334155" stroke-width="3"/>
  <circle cx="100" cy="70" r="5" fill="#64748b"/>
  <!-- Main compartment zip pulls detail -->
  <line x1="30" y1="70" x2="170" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="7,5"/>
  <!-- Front pocket -->
  <rect x="42" y="88" width="48" height="54" rx="6" fill="#1e3a5f" stroke="#2d4f78" stroke-width="1.5"/>
  <!-- Pocket zip -->
  <line x1="42" y1="98" x2="90" y2="98" stroke="#2d5f9e" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Shoulder strap attachment rings -->
  <rect x="55" y="62" width="10" height="10" rx="3" fill="#64748b"/>
  <rect x="135" y="62" width="10" height="10" rx="3" fill="#64748b"/>
  <!-- Top carry handles -->
  <path d="M78,64 C78,46 96,40 100,40 C104,40 122,46 122,64" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Wheel axle bottom -->
  <rect x="26" y="166" width="148" height="6" rx="3" fill="#0f172a"/>
  <!-- Wheels -->
  <circle cx="46" cy="175" r="12" fill="#0f172a"/>
  <circle cx="46" cy="175" r="7" fill="#1e293b"/>
  <circle cx="154" cy="175" r="12" fill="#0f172a"/>
  <circle cx="154" cy="175" r="7" fill="#1e293b"/>
</svg>
